platform:
  observability:
    elk:
      enabled: ${ELK_ENABLED:true}
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
        log-topic: ${ELK_LOG_TOPIC:corridor.core.loan.nova.obs.logs.v1}
        security-protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
        sasl-mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
        sasl-jaas-config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USER}" password="${KAFKA_PASSWORD}";'

management:
  otlp:
    tracing:
      endpoint: ${ELK_APM_OTLP_ENDPOINT:http://apm-server:8200/v1/traces}
      transport: http
      compression: gzip
      timeout: 10s
    metrics:
      export:
        enabled: false

  prometheus:
    metrics:
      export:
        enabled: true
        step: 15s

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh,loggers,env
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      access: unrestricted

  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:unknown}
      namespace: ${OTEL_SERVICE_NAMESPACE:nova}
      instance: ${HOSTNAME:${POD_NAME:unknown}}
      version: ${spring.application.version:unknown}

  tracing:
    enabled: true
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.2}
    propagation:
      type: w3c
    baggage:
      enabled: true
      remote-fields: user-id,correlation-id,tenant-id,request-id
      correlation:
        enabled: true
        fields: user-id,correlation-id,tenant-id,request-id

otel:
  resource:
    attributes:
      service.name: ${spring.application.name}
      service.namespace: ${OTEL_SERVICE_NAMESPACE:nova}
      service.version: ${spring.application.version:unknown}
      service.instance.id: ${HOSTNAME:${POD_NAME:unknown}}
      deployment.environment: ${SPRING_PROFILES_ACTIVE:production}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
