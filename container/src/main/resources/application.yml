spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
    open-in-view: false

  sql:
    init:
      mode: never

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:trade-loan-events}
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
    producer:
      acks: all
      retries: 3
      enable-idempotence: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,traces,refresh
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    baggage:
      enabled: true
      remote-fields: user-id,correlation-id,tenant-id
      correlation:
        enabled: true
        fields: user-id,correlation-id
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
      protocol: http/protobuf
      compression: gzip
      timeout: 10s
    metrics:
      endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT}
      protocol: http/protobuf
      step: 30s

otel:
  resource:
    attributes:
      service.name: ${spring.application.name}
      service.version: ${spring.application.version:unknown}
      service.namespace: ${OTEL_SERVICE_NAMESPACE:development}
      service.instance.id: ${HOSTNAME:${random.uuid}}
      deployment.environment: ${SPRING_PROFILES_ACTIVE:development}
  instrumentation:
    annotations:
      enabled: true
    spring-webmvc:
      enabled: true
    jdbc:
      enabled: true
    kafka:
      enabled: true

platform:
  messaging:
    encryption:
      password: ${ENCRYPTION_PASSWORD}
    outbox:
      batch-size: 100
      poll-interval: PT5S
      lock-timeout: PT5M
      max-retries: 3
      retry-backoff-multiplier: PT2S
      enable-encryption: true
      retention-period: P30D
    inbox:
      batch-size: 50
      processing-interval: PT10S
      duplicate-check-window: P1D
      max-processing-attempts: 5
      dead-letter-threshold: P7D
      enable-idempotency-check: true
    kafka:
      transaction-id-prefix: trade-loan-tx-
      trusted-packages: ir.dotin.*
      max-poll-records: 50
      concurrency: 3
      topics:
        outbox-events: platform.outbox.events
        inbox-events: platform.inbox.events
        dead-letter: platform.deadletter
        partitions: 10
        replicas: 3
    scheduling:
      enabled: true
      default-lock-at-most-for: PT10M
      default-lock-at-least-for: PT1M

fcb:
  integration:
    base-url: http://10.20.151.12:8080/FCB/
    app-name: FCB
    service-path: httpUsecaseRunner
    connection-timeout: 60000
    read-timeout: 80000
    credentials:
      username: admin
      password: abcd1234
    encoding: UTF-8
    show-exceptions: true
    same-session: false