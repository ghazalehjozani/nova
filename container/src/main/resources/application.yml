      uri: mongodb://root:password123@10.20.151.144:27017/morabehe?authSource=admin
  application:
    name: Morabehe
# region Camel config
camel:
  servlet:
    mapping:
      context-path: /api/*
      enabled: true
# region log config
logging:
  level:
    ir.dotin.loan: DEBUG

