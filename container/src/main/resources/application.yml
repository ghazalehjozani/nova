spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  messages:
    basename: messages
    encoding: UTF-8
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
  sql:
    init:
      mode: never
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${platform.security.resource-server.jwk-set-uri}
          issuer-uri: ${platform.security.resource-server.issuer-uri}
  cache:
    type: redis
    redis:
      time-to-live: 600s
      cache-null-values: false
    cache-names:
      - oauth2-tokens
      - jwt-jwks
  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      database: 0
      client-type: lettuce
      lettuce:
        cluster:
          refresh:
            adaptive: true
  threads:
    virtual:
      enabled: true
  cloud:
    kubernetes:
      discovery:
        enabled: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
#          Add FCB Kafka health
          include: readinessState,db,tpsSso,dispatcher,saga,diskSpace
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 30s
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        command.dispatcher.duration: true
        query.dispatcher.duration: true
        saga.duration: true
        saga.step.duration: true
        platform.audit.save.duration: true
        platform.audit.execution.duration: true
        message.processing.duration: true
      percentiles:
        http.server.requests: 0.5,0.75,0.9,0.95,0.99
        http.client.requests: 0.5,0.75,0.9,0.95,0.99
        command.dispatcher.duration: 0.5,0.75,0.9,0.95,0.99
        query.dispatcher.duration: 0.5,0.75,0.9,0.95,0.99
        saga.duration: 0.5,0.75,0.9,0.95,0.99
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:unknown}
  tracing:
    enabled: true
    propagation:
      type: w3c
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
    baggage:
      enabled: true
      remote-fields: user-id,correlation-id,tenant-id,request-id
      correlation:
        enabled: true
        fields: user-id,correlation-id,tenant-id,request-id
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      transport: http
      compression: gzip
      timeout: 10s
    metrics:
      endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
      transport: http
      step: 30s

otel:
  resource:
    attributes:
      service.name: ${spring.application.name}
      service.namespace: ${OTEL_SERVICE_NAMESPACE:trade-loan}
      service.instance.id: ${HOSTNAME:${POD_NAME:unknown}}
      deployment.environment: ${SPRING_PROFILES_ACTIVE:production}
      k8s.namespace.name: ${KUBERNETES_NAMESPACE:default}
      k8s.pod.name: ${POD_NAME:unknown}
      k8s.node.name: ${NODE_NAME:unknown}
  instrumentation:
    annotations:
      enabled: true
    spring-webmvc:
      enabled: true
    jdbc:
      enabled: true
    kafka:
      enabled: true
    redis:
      enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    ir.dotin: INFO
    io.micrometer: INFO
    io.opentelemetry: WARN
    org.springframework.cloud.kubernetes: WARN

platform:
  persistence:
    show-sql: ${SHOW_SQL:false}
    statistics: false
    ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    batch-size: 25
    order-inserts: true
    order-updates: true
    batch-versioned-data: true
    fail-on-pagination-over-collection-fetch: true
    plan-cache-max-size: 2048
    second-level-cache: false
    query-cache: false
  dispatcher:
    command:
      sync-timeout: 1200s
      shutdown-timeout: 600s
      middleware-enabled: true
      idempotency:
        enabled: true
        ttl: 24h
        lock-ttl: 120s
        cleanup-interval: 5m
        cleanup-threshold: 100
        cache-strategy: REDIS
    query:
      sync-timeout: 300s
      middleware-enabled: true
      caching-enabled: false
      cache-strategy: REDIS
      cache-ttl: 2m
    events:
      publisher: spring
      publish-before-commit: true
      publish-async: false
      enforce-event-ordering: true
      max-concurrent-listeners: 10
      shutdown-timeout-seconds: 30
    metrics:
      enabled: true
      log-execution: true
      store-in-context: true
      record-timings: true
      record-counts: true
      record-errors: true
      metrics-prefix: dispatcher
      slow-execution-threshold-ms: 1000
    tracing:
      enabled: true
      propagate-headers: true
      add-mdc-entries: true
      trace-id-header: X-Trace-Id
      span-id-header: X-Span-Id
  audit:
    enabled: true
    payload:
      strategy: FULL
      max-size-bytes: 1048576
    metrics:
      enabled: true
      include-command-type: true
    retention:
      archive-after-days: 365
      retention-days: 2555
  saga:
    persistence:
      table-name: saga_instance
      compensation-table: saga_compensation
    execution:
      default-timeout: 3000000
      executor-core-pool-size: 4
      shutdown-timeout-seconds: 30
    recovery:
      enabled: true
      stuck-threshold: 5m
  messaging:
    enabled: true
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
      consumer-group-id: ${KAFKA_CONSUMER_GROUP:core.loan.facility.*}
      client-id: trade-loan-client
      security:
        protocol: SASL_PLAINTEXT
        sasl-mechanism: SCRAM-SHA-256
        sasl-jaas-config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USER}" password="${KAFKA_PASSWORD}";
      producer:
        acks: all
        retries: 3
        batch-size: 16384
        linger: 100ms
        compression-type: snappy
        request-timeout: 30s
        delivery-timeout: 2m
      consumer:
        auto-offset-reset: earliest
        enable-auto-commit: false
        max-poll-records: 100
        max-poll-interval: 5m
        session-timeout: 120s
        heartbeat-interval: 3s
      reply:
        reply-topic-pattern: ${KAFKA_REPLY_TOPIC_PATTERN:corridor\.core\.loan\.nova\..*\.response\.queue\.v\d+$}
        reply-group-id: ${KAFKA_REPLY_GROUP_ID:core.loan.fcb-reply}
        default-timeout: ${KAFKA_DEFAULT_TIMEOUT:60s}
    outbox:
      enabled: true
      processor-threads: 3
      batch-size: 100
      poll-interval: 5s
      retention-period: 30d
      enable-cleanup: true
      enable-metrics: true
      lock-timeout: 5m
      topic-mappings:
        InstallmentSchedule: "corridor.core.loan.nova.trade-loan-installment-schedule.event.topic.v1"
        TradeLoanArrangement: "corridor.core.loan.nova.trade-loan-arrangement.event.topic.v1"
        TradeLoanFacility: "corridor.core.loan.nova.trade-loan-facility.event.topic.v1"
        TradeLoanType: "corridor.core.loan.nova.trade-loan-type.event.topic.v1"
    inbox:
      enabled: true
      processor-threads: 3
      batch-size: 50
      poll-interval: 10s
      retention-period: 7d
      enable-deduplication: true
      enable-metrics: true
      processing-timeout: 5m
    dead-letter:
      enabled: true
      topic-suffix: dlq
      max-retries: 3
      retry-interval: 1m
      enable-alerts: true
      alert-threshold: 5m
      alert-batch-size: 10
    retry:
      max-attempts: 3
      initial-interval: 500ms
      multiplier: 2.0
      max-interval: 30s
      max-duration: 10m
    resilience:
      circuit-breaker:
        enabled: true
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-rate-threshold: 80.0
        slow-call-duration-threshold: 5s
        enable-metrics: true
      retry-pattern:
        enabled: true
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2.0
        max-wait-duration: 10s
        enable-metrics: true
      bulkhead:
        enabled: false
        max-concurrent-calls: 25
        max-wait-duration: 1s
      rate-limiter:
        enabled: false
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 500ms
    encryption:
      password: ${ENCRYPTION_PASSWORD}
    scheduling:
      enabled: true
      default-lock-at-most-for: 10m
      default-lock-at-least-for: 1m
  security:
    enabled: true
    resource-server:
      issuer-uri: https://sso.tps.ir
      jwk-set-uri: https://sso.tps.ir/.well-known/openid-configuration/jwks
      delegation-request-uri: https://sso.tps.ir/oauth/delegate/token-request
      jwks-cache-lifespan: 5m
      extract-user-context: true
      user-id-claim: sub
      client-id-claim: azp
      branch-code-claim: branch_code
      server-address-claim: server_address
      validate-azp-claim: true
      validate-branch-code: true
      allowed-clients:
        - edfa96a6-8818-44b7-9de6-54c253b952e3
    oauth2-client:
      enabled: true
      client-id: ${OAUTH2_CLIENT_ID}
      client-secret: ${OAUTH2_CLIENT_SECRET}
      token-uri: https://sso.tps.ir/oauth/token
      scopes:
        - openid
        - upgrade_token
        - core
        - delegate_token
      support-delegation: true
      delegation-claim-buffer: 10s
      use-refresh-token: true
      cache-tokens: true
      token-cache-buffer: 5m
      support-token-upgrade: true
      connection-timeout: 5s
      read-timeout: 10s
      max-connections: 100
      max-per-route: 20
    authorization:
      public-paths:
        - /actuator/health
        - /actuator/prometheus
        - /actuator/metrics
        - /actuator/health/liveness
        - /actuator/health/readiness
        - /actuator/info
        - /swagger-ui/**
        - /springwolf/asyncapi-ui.html
        - /springwolf/**
        - /springwolf/docs.yaml
        - /v3/api-docs/**
        - /v3/api-docs
        - /api/v1/dev/auth/callback
      require-authentication-by-default: true
    audit:
      enabled: true
      log-authentication-success: false
      log-authentication-failure: false
      log-access-denied: false
      log-token-acquisition: false
      log-token-validation: false
      log-banking-context: false
      slow-request-threshold-ms: 1000
      sensitive-headers:
        - Authorization
        - Cookie
        - Set-Cookie
      sensitive-fields:
        - password
        - secret
        - token
      log-request-body: true
      log-response-body: true
      log-token-failures: false
    ssl:
      verify: true
    resilience:
      circuit-breaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        sliding-window-size: 10
      retry:
        max-attempts: 3
        wait-duration: 500ms
      rate-limiter:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 5s
    dev-auth:
      enabled: true
      branch-code: "1"
  rest:
    api-path-pattern: /api/*
    headers:
      default-language: fa
  observability:
    tracing:
      sampling-probability: 1.0
      propagation-type: W3C
      enabled: true
    enabled: true
    health:
      metrics-enabled: true
      export-interval: 30s
    metrics:
      enabled: true
      jvm:
        classes: true
        compilation: true
        enabled: true
        gc: true
        memory: true
        threads: true
      system:
        disk-space: true
        enabled: true
        file-descriptors: true
        processor: true
        uptime: true
    logging:
      format: json
      include-trace-context: true
      structured: true
  protocol:
    issuer: NOVA


fcb:
  integration:
    base-url: ${FCB_BASE_URL}
    app-name: FCB
    service-path: httpUsecaseRunner
    connection-timeout: 600000
    read-timeout: 80000
    credentials:
      username: ${FCB_USERNAME}
      password: ${FCB_PASSWORD}
    encoding: UTF-8
    show-exceptions: true
    same-session: false
  health:
    enabled: true
    test-usecase: system-health-check
    timeout-seconds: 10
    cache-duration-seconds: 30
    failure-threshold: 3
    show-details: true
    metrics-enabled: true
  observability:
    enabled: true
    metrics:
      enabled: true
      jvm:
        gc: true
        memory: true
        threads: true
        classes: true
        compilation: true
      system:
        processor: true
        uptime: true
        file-descriptors: true
        disk-space: true
      custom-dimensions:
        team: platform
        domain: trade-loan
    tracing:
      enabled: true
      sampling-probability: 0.1
      baggage-fields:
        - user-id
        - correlation-id
        - tenant-id
        - request-id
    health:
      metrics-enabled: true
      check-interval: 30000
    logging:
      enabled: true
      structured-json: true

nova:
  fcb:
    kafka:
      request-topic: ${FCB_KAFKA_REQUEST_TOPIC:corridor.core.loan.nova.fcb-integration.request.queue.v1}
      reply-topic: ${FCB_KAFKA_REPLY_TOPIC:corridor.core.loan.nova.fcb-integration.response.queue.v1}
      reply-group-id: ${FCB_KAFKA_REPLY_GROUP_ID:core.loan.fcb-reply}
      default-timeout: ${FCB_KAFKA_DEFAULT_TIMEOUT:60s}
      transaction-timeout: ${FCB_KAFKA_TRANSACTION_TIMEOUT:60s}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    display-request-duration: true
    persist-authorization: true
    tags-sorter: none
    oauth:
      client-id: ${OAUTH2_CLIENT_ID}
      client-secret: ${OAUTH2_CLIENT_SECRET}
      use-basic-authentication-with-access-code-grant: false
      scopes:
        - openid
        - core
        - offline_access
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

springwolf:
  enabled: true
  docket:
    base-package: ir.dotin.loan.trade
    info:
      title: ${spring.application.name}
      version: 1.0.0
    servers:
      kafka-server:
        protocol: kafka
        host: localhost:9092
