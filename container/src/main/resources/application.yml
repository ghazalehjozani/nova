spring:
  application:
    name: trade-loan-service
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: sudoit
    password: p@sSw0rd
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:banking-platform}
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
    producer:
      acks: all
      retries: 3
      enable-idempotence: true
server:
  port: 8080
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0  # 0.1 (10%) for production
    baggage:
      enabled: true
      remote-fields: user-id,correlation-id,tenant-id
      correlation:
        enabled: true
        fields: user-id,correlation-id
  
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
      protocol: http/protobuf
      compression: gzip
      timeout: 10s
    metrics:
      endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://127.0.0.1:4318/v1/metrics}
      protocol: http/protobuf
      step: 30s
  
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,traces
  
  endpoint:
    health:
      show-details: always
  
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

otel:
  resource:
    attributes:
      service.name: ${spring.application.name}
      service.version: ${spring.application.version:unknown}
      service.namespace: ${OTEL_SERVICE_NAMESPACE:development}
      service.instance.id: ${HOSTNAME:${random.uuid}}
      deployment.environment: ${SPRING_PROFILES_ACTIVE:development}
  
  instrumentation:
    annotations:
      enabled: true
    spring-webmvc:
      enabled: true
    jdbc:
      enabled: true
    kafka:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
  
  level:
    io.opentelemetry: INFO
    io.micrometer: INFO
    org.springframework.web: DEBUG
    ir.dotin: DEBUG


platform:
  messaging:
    outbox:
      batch-size: 100
      poll-interval: PT5S
      lock-timeout: PT5M
      max-retries: 3
      retry-backoff-multiplier: PT2S
      enable-encryption: true
      retention-period: P30D

    inbox:
      batch-size: 50
      processing-interval: PT10S
      duplicate-check-window: P1D
      max-processing-attempts: 5
      dead-letter-threshold: P7D
      enable-idempotency-check: true

    kafka:
      transaction-id-prefix: banking-tx-
      trusted-packages: "ir.dotin.*"
      max-poll-records: 50
      concurrency: 3
      topics:
        outbox-events: platform.outbox.events
        inbox-events: platform.inbox.events
        dead-letter: platform.deadletter
        partitions: 10
        replicas: 3

    scheduling:
      enabled: true
      default-lock-at-most-for: PT10M
      default-lock-at-least-for: PT1M

    encryption:
      password: ${ENCRYPTION_PASSWORD:DefaultSecurePassword123!@#}
