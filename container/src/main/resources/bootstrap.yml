spring:
  application:
    name: morabehe-loan
  profiles:
    active: dev
  cloud:
    consul:
      host: 10.100.7.20
      port: 8500
      config:
        enabled: true
        format: FILES
        fail-fast: true
        profileSeparator: '::'
        prefixes: config/${spring.application.name}
        watch:
          enabled: true
          delay: 1000
      discovery:
        enabled: true
        prefer-ip-address: true
        health-check-interval: 30s
        health-check-critical-timeout: 90s
        health-check-path: /actuator/health
        instance-id: ${spring.application.name}-${spring.application.instance_id:${random.value}}