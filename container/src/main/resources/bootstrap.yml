---
spring:
  application:
    name: nova-service
    version: '@project.version@'

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  cloud:
    consul:
      enabled: true
      host: ${CONSUL_HOST}
      port: ${CONSUL_PORT}
      scheme: http
      discovery:
        enabled: true
        prefer-ip-address: true
        ip-address: ${DEFAULT_IP_ADDRESS}
        instance-id: centralized-banking-expenditures-loan-${spring.application.name}-${random.uuid}
        service-name: centralized-banking-expenditures-loan-${spring.application.name}
        health-check-critical-timeout: 180s
        tags:
          - profile=${SPRING_PROFILES_ACTIVE}
          - version=@project.version@
          - zone=centralized-banking-expenditures
          - role=backend-service
        metadata:
          version: '@project.version@'
          management-context-path: /actuator
      config:
        enabled: true
        format: KEY_VALUE
        prefixes:
          - Centralized-Banking/expenditures/loan/nova
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
