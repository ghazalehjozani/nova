spring:
  application:
    name: trade-loan-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  cloud:
    kubernetes:
      enabled: true
      discovery:
        enabled: false
      config:
        enabled: true
        name: trade-loan-service-config
        namespace: ${KUBERNETES_NAMESPACE:default}
        paths: /app/config
        enable-api: false
      secrets:
        enabled: true
        name: trade-loan-service-secrets
        namespace: ${KUBERNETES_NAMESPACE:default}
        enable-api: true
      reload:
        enabled: true
        mode: event
        strategy: refresh
        period: 15000