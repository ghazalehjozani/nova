server:
  port: 8085
# region Spring config
spring:
  application:
    name: morabehe-loan
  profiles:
    active: dev
  cloud:
    consul:
      host: 10.20.151.144
      port: 8500
      config:
        enabled: true
        default-context: application
        profileSeparator: '::'
        prefixes: configuration
        fail-fast: true
        format: yaml
        watch:
          enabled: true
      discovery:
        enabled: true
        prefer-ip-address: true
        health-check-interval: 30s
        health-check-critical-timeout: 90s
        health-check-path: /actuator/health
        instance-id: ${spring.application.name}-${spring.application.instance_id:${random.value}}

management:
  endpoints:
    web:
      exposure:
        include: "*"