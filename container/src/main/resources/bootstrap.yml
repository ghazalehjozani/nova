spring:
  application:
    name: trade-loan-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  cloud:
    kubernetes:
      enabled: true
      config:
        enabled: true
        name: trade-loan-service-config
        namespace: default
      secrets:
        enabled: true
        name: trade-loan-service-secrets
        namespace: default
      reload:
        enabled: true
        mode: event
        strategy: refresh