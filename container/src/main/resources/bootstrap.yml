spring:
  application:
    name: trade-loan-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
---
spring:
  config:
    activate:
      on-profile: k8s
  cloud:
    kubernetes:
      enabled: true
      config:
        enabled: true
        sources:
          - name: application-config
          - name: ${spring.application.name}-config
      secrets:
        enabled: true
        sources:
          - name: ${spring.application.name}-secrets
      reload:
        enabled: true
        mode: event
        strategy: refresh