---

spring:
  jpa:
    open-in-view: false
  sql:
    init:
      mode: never
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  cache:
    type: redis
    redis:
      time-to-live: 60s
      cache-null-values: false
    cache-names:
      - oauth2-tokens
      - jwt-jwks
  data:
    redis:
      password: ${REDIS_PASSWORD:e2e_redis_pass}
      timeout: 3000ms
      database: 0
      client-type: lettuce
      sentinel:
        enabled: false
  threads:
    virtual:
      enabled: true
  cloud:
    kubernetes:
      discovery:
        enabled: false

server:
  port: 0
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: false
      group:
        liveness:
          include: ping
        readiness:
          include: ping
  health:
    livenessstate:
      enabled: false
    readinessstate:
      enabled: false
  tracing:
    export:
      enabled: false

logging:
  level:
    ir.dotin: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
    org.testcontainers: INFO
    org.springframework.cloud.kubernetes: WARN

platform:
  persistence:
    show-sql: false
    statistics: false
    ddl-auto: none
    batch-size: 25
    order-inserts: true
    order-updates: true
    batch-versioned-data: true
    fail-on-pagination-over-collection-fetch: true
    plan-cache-max-size: 256
    second-level-cache: false
    query-cache: false
  dispatcher:
    command:
      sync-timeout: 30s
      shutdown-timeout: 10s
      middleware-enabled: true
      idempotency:
        enabled: true
        ttl: 1h
        lock-ttl: 30s
        cleanup-interval: 5m
        cleanup-threshold: 100
        cache-strategy: REDIS
    query:
      sync-timeout: 10s
      middleware-enabled: true
      caching-enabled: true
      cache-strategy: REDIS
      cache-ttl: 1m
    events:
      publisher: spring
      publish-before-commit: true
      publish-async: false
      enforce-event-ordering: true
      max-concurrent-listeners: 4
      shutdown-timeout-seconds: 10
    metrics:
      enabled: false
      log-execution: false
      store-in-context: false
      record-timings: false
      record-counts: false
      record-errors: false
    tracing:
      enabled: false
      propagate-headers: false
      add-mdc-entries: false
  audit:
    enabled: false
  saga:
    persistence:
      table-name: saga_instance
      compensation-table: saga_compensation
    execution:
      default-timeout: 300000
      executor-core-pool-size: 4
      shutdown-timeout-seconds: 30
    recovery:
      enabled: false
  messaging:
    enabled: true
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:host.docker.internal:9094}
      consumer-group-id: ${KAFKA_CONSUMER_GROUP:core.loan.facility.*}
      client-id: trade-loan-e2e-client
      security:
        protocol: SASL_PLAINTEXT
        sasl-mechanism: PLAIN
        sasl-jaas-config: >-
          org.apache.kafka.common.security.plain.PlainLoginModule required
          username="admin"
          password="admin-secret";
      producer:
        acks: all
        retries: 3
        batch-size: 16384
        linger: 100ms
        compression-type: snappy
        request-timeout: 30s
        delivery-timeout: 2m
      consumer:
        auto-offset-reset: earliest
        enable-auto-commit: false
        max-poll-records: 100
        max-poll-interval: 5m
        session-timeout: 120s
        heartbeat-interval: 3s
    outbox:
      enabled: true
      processor-threads: 3
      batch-size: 100
      poll-interval: 5s
      retention-period: 30d
      enable-cleanup: true
      enable-metrics: true
      lock-timeout: 5m
      topic-mappings:
        InstallmentSchedule: "corridor.core.loan.nova.trade-loan-installment-schedule.event.topic.v1"
        TradeLoanArrangement: "corridor.core.loan.nova.trade-loan-arrangement.event.topic.v1"
        TradeLoanFacility: "corridor.core.loan.nova.trade-loan-facility.event.topic.v1"
        TradeLoanType: "corridor.core.loan.nova.trade-loan-type.event.topic.v1"
    inbox:
      enabled: true
      processor-threads: 3
      batch-size: 50
      poll-interval: 10s
      retention-period: 7d
      enable-deduplication: true
      enable-metrics: true
      processing-timeout: 5m
    dead-letter:
      enabled: true
      topic-suffix: dlq
      max-retries: 3
      retry-interval: 1m
      enable-alerts: true
      alert-threshold: 5m
      alert-batch-size: 10
    retry:
      max-attempts: 3
      initial-interval: 500ms
      multiplier: 2.0
      max-interval: 30s
      max-duration: 10m
    resilience:
      circuit-breaker:
        enabled: true
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-rate-threshold: 80.0
        slow-call-duration-threshold: 5s
        enable-metrics: true
      retry-pattern:
        enabled: true
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2.0
        max-wait-duration: 10s
        enable-metrics: true
      bulkhead:
        enabled: false
        max-concurrent-calls: 25
        max-wait-duration: 1s
      rate-limiter:
        enabled: false
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 500ms
    encryption:
      password: e2e-encryption-key-for-test
    scheduling:
      enabled: true
      default-lock-at-most-for: 10m
      default-lock-at-least-for: 1m
  security:
    enabled: false
    resource-server:
      issuer-uri: https://sso.tps.ir
      jwk-set-uri: https://sso.tps.ir/.well-known/openid-configuration/jwks
      jwks-cache-lifespan: 5m
      extract-user-context: true
      user-id-claim: sub
      client-id-claim: azp
      branch-code-claim: branch_code
      server-address-claim: server_address
      validate-azp-claim: true
      validate-branch-code: true
      allowed-clients:
        - 1ebad0ab-39d1-4718-9690-ec1873c6914f
    oauth2-client:
      enabled: true
      client-id: ${OAUTH2_CLIENT_ID}
      client-secret: ${OAUTH2_CLIENT_SECRET}
      token-uri: https://sso.tps.ir/oauth/token
      scopes:
        - openid
        - upgrade_token
        - core
      use-refresh-token: true
      cache-tokens: true
      token-cache-buffer: 5m
      support-token-upgrade: true
      connection-timeout: 5s
      read-timeout: 10s
      max-connections: 100
      max-per-route: 20
    authorization:
      public-paths:
        - /actuator/health
        - /actuator/prometheus
        - /actuator/metrics
        - /actuator/health/liveness
        - /actuator/health/readiness
        - /actuator/info
        - /swagger-ui/**
        - /asyncapi.yaml
        - /v3/api-docs/**
        - /v3/api-docs
        - /api/v1/dev/auth/callback
      require-authentication-by-default: true
    audit:
      enabled: true
      log-authentication-success: false
      log-authentication-failure: false
      log-access-denied: false
      log-token-acquisition: false
      log-token-validation: false
      log-banking-context: false
      slow-request-threshold-ms: 1000
      sensitive-headers:
        - Authorization
        - Cookie
        - Set-Cookie
      sensitive-fields:
        - password
        - secret
        - token
      log-request-body: true
      log-response-body: true
      log-token-failures: false
    ssl:
      verify: true
    resilience:
      circuit-breaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        sliding-window-size: 10
      retry:
        max-attempts: 3
        wait-duration: 500ms
      rate-limiter:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 5s
    dev-auth:
      enabled: true
      branch-code: "1"
  rest:
    api-path-patterns:
      - /api/*
      - /v1/*
    headers:
      default-language: fa
  observability:
    tracing:
      sampling-probability: 1.0
      propagation-type: W3C
      enabled: true
    enabled: true
    health:
      metrics-enabled: true
      export-interval: 30s
    metrics:
      enabled: true
      jvm:
        classes: true
        compilation: true
        enabled: true
        gc: true
        memory: true
        threads: true
      system:
        disk-space: true
        enabled: true
        file-descriptors: true
        processor: true
        uptime: true
    logging:
      format: json
      include-trace-context: true
      structured: true
  protocol:
    issuer: LOAN

fcb:
  integration:
    base-url: http://localhost:9999/mock-fcb
    app-name: FCB
    service-path: httpUsecaseRunner
    connection-timeout: 5000
    read-timeout: 5000
    credentials:
      username: e2e_user
      password: e2e_pass
    encoding: UTF-8
    show-exceptions: true
    same-session: false
  health:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

e2e:
  auth:
    token: ${E2E_AUTH_TOKEN:}
