apiVersion: v1
kind: ConfigMap
metadata:
  name: trade-loan-service-config
  namespace: default
data:
  application.yml: |
    spring:
      profiles:
        active: ${SPRING_PROFILES_ACTIVE}
      messages:
        basename: messages
        encoding: UTF-8
      datasource:
        driver-class-name: org.postgresql.Driver
        hikari:
          maximum-pool-size: 10
          minimum-idle: 5
          connection-timeout: 30000
          idle-timeout: 600000
          max-lifetime: 1800000
      jpa:
        open-in-view: false
      sql:
        init:
          mode: never
      liquibase:
        change-log: classpath:db/changelog/db.changelog-master.xml
        enabled: true
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
      security:
        oauth2:
          resourceserver:
            jwt:
              jwk-set-uri: ${platform.security.resource-server.jwk-set-uri}
              issuer-uri: ${platform.security.resource-server.issuer-uri}
      cache:
        type: redis
        redis:
          time-to-live: 600s
          cache-null-values: false
        cache-names:
          - oauth2-tokens
          - jwt-jwks
      data:
        redis:
          host: ${REDIS_HOST}
          port: ${REDIS_PORT}
          password: ${REDIS_PASSWORD}
          timeout: 3000ms
          database: 0
          client-type: lettuce
          lettuce:
            cluster:
              refresh:
                adaptive: true
    server:
      port: 8080
    
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus,traces,refresh
      endpoint:
        health:
          show-details: always
          group:
            liveness:
              include: livenessState
            readiness:
              include: readinessState,db,redis,messaging,tpsSso,dispatcher,diskSpace
          probes:
            enabled: true
      metrics:
        distribution:
          percentiles-histogram:
            http.server.requests: true
          percentiles:
            http.server.requests: 0.5,0.95,0.99
      tracing:
        enabled: true
        sampling:
          probability: 1.0
        baggage:
          enabled: true
          remote-fields: user-id,correlation-id,tenant-id
          correlation:
            enabled: true
            fields: user-id,correlation-id
      otlp:
        tracing:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
          protocol: http/protobuf
          compression: gzip
          timeout: 10s
        metrics:
          endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT}
          protocol: http/protobuf
          step: 30s
    
    otel:
      resource:
        attributes:
          service.name: ${spring.application.name}
          service.version: ${spring.application.version:unknown}
          service.namespace: ${OTEL_SERVICE_NAMESPACE:development}
          service.instance.id: ${HOSTNAME:${random.uuid}}
          deployment.environment: ${SPRING_PROFILES_ACTIVE:development}
      instrumentation:
        annotations:
          enabled: true
        spring-webmvc:
          enabled: true
        jdbc:
          enabled: true
        kafka:
          enabled: true
    
    platform:
      persistence:
        show-sql: ${SHOW_SQL:false}
        statistics: false
        ddl-auto: ${HIBERNATE_DDL_AUTO:none}
        batch-size: 25
        order-inserts: true
        order-updates: true
        batch-versioned-data: true
        fail-on-pagination-over-collection-fetch: true
        plan-cache-max-size: 2048
        second-level-cache: false
        query-cache: false
      dispatcher:
        command:
          sync-timeout: 60s
          shutdown-timeout: 60s
          middleware-enabled: true
          idempotency:
            enabled: true
            ttl: 24h
            lock-ttl: 60s
            cleanup-interval: 5m
            cleanup-threshold: 100
            cache-strategy: REDIS
        query:
          sync-timeout: 30s
          middleware-enabled: true
          caching-enabled: true
          cache-strategy: REDIS
          cache-ttl: 2m
        events:
          publisher: spring
          publish-before-commit: true
          publish-async: false
          enforce-event-ordering: true
          max-concurrent-listeners: 10
          shutdown-timeout-seconds: 30
        metrics:
          enabled: true
          log-execution: true
          store-in-context: true
          record-timings: true
          record-counts: true
          record-errors: true
          metrics-prefix: dispatcher
          slow-execution-threshold-ms: 1000
        tracing:
          enabled: true
          propagate-headers: true
          add-mdc-entries: true
          trace-id-header: X-Trace-Id
          span-id-header: X-Span-Id
      messaging:
        enabled: true
        kafka:
          bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
          consumer-group-id: ${KAFKA_CONSUMER_GROUP:trade-loan-events}
          client-id: trade-loan-client
    #      security:
    #        protocol: SASL_PLAINTEXT
    #        sasl-mechanism: SCRAM-SHA-256
    #        sasl-jaas-config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USER}" password="${KAFKA_PASSWORD}";
          producer:
            acks: all
            retries: 3
            batch-size: 16384
            linger: 100ms
            compression-type: snappy
            request-timeout: 30s
            delivery-timeout: 2m
          consumer:
            auto-offset-reset: earliest
            enable-auto-commit: false
            max-poll-records: 50
            max-poll-interval: 5m
            session-timeout: 30s
            heartbeat-interval: 3s
        outbox:
          enabled: true
          processor-threads: 3
          batch-size: 100
          poll-interval: 5s
          retention-period: 30d
          enable-cleanup: true
          enable-metrics: true
          lock-timeout: 5m
          topic-mappings:
            InstallmentSchedule:
              - corridor.core.loan.installment.equal-installments-created.topic.v1
              - corridor.core.loan.installment.gradual-installments-created.topic.v1
              - corridor.core.loan.installment.schedule-activated.topic.v1
              - corridor.core.loan.installment.schedule-cancelled.topic.v1
              - corridor.core.loan.installment.schedule-completed.topic.v1
              - corridor.core.loan.installment.schedule-on-held.topic.v1
              - corridor.core.loan.installment.schedule-restructured.topic.v1
              - corridor.core.loan.installment.schedule-state-transitioned.topic.v1
            TradeLoanArrangement:
              - corridor.core.loan.arrangement.trade-loan-arrangement-created.topic.v1
            TradeLoanFacility:
              - corridor.core.loan.facility.trade-loan-facility-activated.topic.v1
              - corridor.core.loan.facility.trade-loan-facility-additional-disbursement-completed.topic.v1
              - corridor.core.loan.facility.trade-loan-facility-approved.topic.v1
              - corridor.core.loan.facility.trade-loan-facility-cancelled.topic.v1
              - corridor.core.loan.facility.trade-loan-facility-closed-defaulted.topic.v1
              - corridor.core.loan.facility.trade-loan-facility-paid-off-closed.topic.v1
              - corridor.core.loan.facility.trade-loan-facility-collateral-added.topic.v1
              - corridor.core.loan.facility.trade-loan-facility-contract-issued.topic.v1
              - corridor.core.loan.facility.trade-loan-facility-created.topic.v1
              - corridor.core.loan.facility.trade-loan-facility-disbursement-failed.topic.v1
              - corridor.core.loan.facility.trade-loan-facility-irregularly-disbursed.topic.v1
              - corridor.core.loan.facility.trade-loan-facility-partially-disbursed.topic.v1
              - corridor.core.loan.facility.trade-loan-facility-approval-submitted.topic.v1
              - corridor.core.loan.facility.trade-loan-facility-rejected.topic.v1
            TradeLoanType:
              - corridor.core.loan.type.trade-loan-type-created.topic.v1
        inbox:
          enabled: true
          processor-threads: 3
          batch-size: 50
          poll-interval: 10s
          retention-period: 7d
          enable-deduplication: true
          enable-metrics: true
          processing-timeout: 5m
        dead-letter:
          enabled: true
          topic-suffix: dlq
          max-retries: 3
          retry-interval: 1m
          enable-alerts: true
          alert-threshold: 5m
          alert-batch-size: 10
        retry:
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2.0
          max-interval: 30s
          max-duration: 10m
        resilience:
          circuit-breaker:
            enabled: true
            failure-rate-threshold: 50.0
            wait-duration-in-open-state: 30s
            sliding-window-size: 10
            minimum-number-of-calls: 5
            permitted-number-of-calls-in-half-open-state: 3
            slow-call-rate-threshold: 80.0
            slow-call-duration-threshold: 5s
            enable-metrics: true
          retry-pattern:
            enabled: true
            max-attempts: 3
            wait-duration: 500ms
            exponential-backoff-multiplier: 2.0
            max-wait-duration: 10s
            enable-metrics: true
          bulkhead:
            enabled: false
            max-concurrent-calls: 25
            max-wait-duration: 1s
          rate-limiter:
            enabled: false
            limit-for-period: 100
            limit-refresh-period: 1s
            timeout-duration: 500ms
        encryption:
          password: ${ENCRYPTION_PASSWORD}
        scheduling:
          enabled: true
          default-lock-at-most-for: 10m
          default-lock-at-least-for: 1m
      security:
        enabled: true
        resource-server:
          issuer-uri: https://sso.tps.ir
          jwk-set-uri: https://sso.tps.ir/.well-known/openid-configuration/jwks
          jwks-cache-lifespan: 5m
          extract-user-context: true
          user-id-claim: sub
          client-id-claim: azp
          branch-code-claim: branch_code
          server-address-claim: server_address
          validate-azp-claim: true
          validate-branch-code: true
          allowed-clients:
            - 1ebad0ab-39d1-4718-9690-ec1873c6914f # nova-service-client-dev
        oauth2-client:
          enabled: true
          client-id: ${OAUTH2_CLIENT_ID}
          client-secret: ${OAUTH2_CLIENT_SECRET}
          token-uri: https://sso.tps.ir/oauth/token
          scopes:
            - openid
            - upgrade_token
            - core
          use-refresh-token: true
          cache-tokens: true
          token-cache-buffer: 5m
          support-token-upgrade: true
          connection-timeout: 5s
          read-timeout: 10s
          max-connections: 100
          max-per-route: 20
        authorization:
          public-paths:
            - /actuator/health
            - /actuator/health/liveness
            - /actuator/health/readiness
            - /actuator/info
            - /swagger-ui/**
            - /v3/api-docs/**
            - /v3/api-docs
            - /api/dev/auth/token
          require-authentication-by-default: true
        audit:
          enabled: true
          log-authentication-success: true
          log-authentication-failure: true
          log-access-denied: true
          log-token-acquisition: true
          log-token-validation: true
          log-banking-context: true
          slow-request-threshold-ms: 1000
          sensitive-headers:
            - Authorization
            - Cookie
            - Set-Cookie
          sensitive-fields:
            - password
            - secret
            - token
        ssl:
          verify: true
        resilience:
          circuit-breaker:
            failure-rate-threshold: 50
            wait-duration-in-open-state: 30s
            permitted-number-of-calls-in-half-open-state: 5
            sliding-window-size: 10
          retry:
            max-attempts: 3
            wait-duration: 500ms
          rate-limiter:
            limit-for-period: 100
            limit-refresh-period: 1s
            timeout-duration: 5s
        dev-auth:
          enabled: true
          branch-code: "1"
      rest:
        service-prefix: LOAN
        api-path-pattern: /v1/**
        headers:
          required: true
          default-ttl-seconds: 60
          default-language: fa
    fcb:
      integration:
        base-url: ${FCB_BASE_URL}
        app-name: FCB
        service-path: httpUsecaseRunner
        connection-timeout: 60000
        read-timeout: 80000
        credentials:
          username: ${FCB_USERNAME}
          password: ${FCB_PASSWORD}
        encoding: UTF-8
        show-exceptions: true
        same-session: false
      health:
        enabled: true
        test-usecase: system-health-check
        timeout-seconds: 10
        cache-duration-seconds: 30
        failure-threshold: 3
        show-details: true
        metrics-enabled: true
    
    springdoc:
      api-docs:
        enabled: true
        path: /v3/api-docs
      swagger-ui:
        enabled: true
        path: /swagger-ui.html
        operations-sorter: method
        display-request-duration: true
        persist-authorization: true
        tags-sorter: none
      show-actuator: true
      default-consumes-media-type: application/json
      default-produces-media-type: application/json
