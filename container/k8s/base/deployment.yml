apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-loan-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-loan-service
  template:
    metadata:
      labels:
        app: trade-loan-service
    spec:
      serviceAccountName: trade-loan-service
      containers:
        - name: trade-loan-service
          image: trade-loan-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_CLOUD_KUBERNETES_CONFIG_NAME
              value: "trade-loan-service-config"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: spring.datasource.url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: spring.datasource.username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: spring.datasource.password
            - name: ENCRYPTION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: platform.messaging.encryption.password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_CONSUMER_GROUP
              value: "trade-loan-events"
            - name: REDIS_PASSWORD
              value: ""
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://127.0.0.1:4318/v1/traces"
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: "http://127.0.0.1:4318/v1/metrics"
            - name: OAUTH2_CLIENT_ID
              value: ""
            - name: OAUTH2_CLIENT_SECRET
              value: ""
            - name: FCB_BASE_URL
              value: ""
            - name: FCB_USERNAME
              value: ""
            - name: FCB_PASSWORD
              value: ""
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
