apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-loan-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-loan-service
  template:
    metadata:
      labels:
        app: trade-loan-service
    spec:
      serviceAccountName: trade-loan-service
      containers:
        - name: trade-loan-service
          image: trade-loan-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: spring.datasource.url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: spring.datasource.username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: spring.datasource.password
            - name: ENCRYPTION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: platform.messaging.encryption.password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5