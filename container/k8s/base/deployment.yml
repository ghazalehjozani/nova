apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-loan-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-loan-service
  template:
    metadata:
      labels:
        app: trade-loan-service
    spec:
      serviceAccountName: trade-loan-service
      containers:
        - name: trade-loan-service
          image: trade-loan-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_CLOUD_KUBERNETES_CONFIG_NAME
              value: "trade-loan-service-config"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: spring.datasource.url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: spring.datasource.username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: spring.datasource.password
            - name: ENCRYPTION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: platform.messaging.encryption.password
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: kafka.bootstrap.servers
            - name: KAFKA_CONSUMER_GROUP
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: kafka.consumer.group
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: redis.password
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: spring.data.redis.host
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: spring.data.redis.port
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: otel.traces.endpoint
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: otel.metrics.endpoint
            - name: OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: oauth2.client.id
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: oauth2.client.secret
            - name: FCB_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: fcb.base.url
            - name: FCB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: fcb.username
            - name: FCB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trade-loan-service-secrets
                  key: fcb.password
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3