---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: trade-loan-service
  namespace: default
  labels:
    app: trade-loan-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trade-loan-service-config-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["trade-loan-service-config"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["trade-loan-service-secrets"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trade-loan-service-config-reader
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trade-loan-service-config-reader
subjects:
  - kind: ServiceAccount
    name: trade-loan-service
    namespace: default
