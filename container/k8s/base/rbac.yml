apiVersion: v1
kind: ServiceAccount
metadata:
  name: trade-loan-service
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trade-loan-service-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trade-loan-service-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: trade-loan-service
    namespace: default
roleRef:
  kind: Role
  name: trade-loan-service-role
  apiGroup: rbac.authorization.k8s.io