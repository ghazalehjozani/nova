---

services:
  postgres:
    image: postgres:18.0-alpine
    container_name: postgres-nova
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-postgres}
      TZ: Asia/Tehran
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-master:
    image: redis:8.6-alpine
    container_name: redis-master
    restart: unless-stopped
    command: >
      redis-server /etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
    volumes:
      - ./redis/redis-master.conf:/etc/redis/redis.conf:ro
      - redis-master-data:/data
    networks:
      - app-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-1:
    image: redis:8.6-alpine
    container_name: redis-replica-1
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy
    command:
      - redis-server
      - --bind
      - 0.0.0.0
      - --port
      - "6379"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - allkeys-lru
      - --tcp-keepalive
      - "60"
      - --replicaof
      - redis-master
      - "6379"
      - --replica-read-only
      - "yes"
      - --replica-announce-ip
      - redis-replica-1
      - --replica-announce-port
      - "6379"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
    volumes:
      - redis-replica-1-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-2:
    image: redis:8.6-alpine
    container_name: redis-replica-2
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy
    command:
      - redis-server
      - --bind
      - 0.0.0.0
      - --port
      - "6379"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - allkeys-lru
      - --tcp-keepalive
      - "60"
      - --replicaof
      - redis-master
      - "6379"
      - --replica-read-only
      - "yes"
      - --replica-announce-ip
      - redis-replica-2
      - --replica-announce-port
      - "6379"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
    volumes:
      - redis-replica-2-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-sentinel-1: &sentinel
    image: redis:8.6-alpine
    container_name: redis-sentinel-1
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    environment:
      ANNOUNCE_IP: redis-sentinel-1
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - |
        sed -e "s|\${ANNOUNCE_IP}|$$ANNOUNCE_IP|g" \
            -e "s|\${REDIS_MASTER_NAME}|$$REDIS_MASTER_NAME|g" \
            -e "s|\${REDIS_PASSWORD}|$$REDIS_PASSWORD|g" \
            /etc/redis/sentinel.conf.tmpl > /tmp/sentinel.conf
        exec redis-sentinel /tmp/sentinel.conf
    volumes:
      - ./redis/sentinel.conf.tmpl:/etc/redis/sentinel.conf.tmpl:ro
    networks:
      - app-network
    ports:
      - "26379:26379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-sentinel-2:
    <<: *sentinel
    container_name: redis-sentinel-2
    environment:
      ANNOUNCE_IP: redis-sentinel-2
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "26380:26379"

  redis-sentinel-3:
    <<: *sentinel
    container_name: redis-sentinel-3
    environment:
      ANNOUNCE_IP: redis-sentinel-3
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "26381:26379"

  activemq:
    image: rmohr/activemq
    container_name: activemq
    ports:
      - "61616:61616"   # JMS
      - "8161:8161"     # Web console
    environment:
      ACTIVEMQ_ADMIN_LOGIN: admin
      ACTIVEMQ_ADMIN_PASSWORD: admin
    volumes:
      - activemq-data:/opt/activemq/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:
  activemq-data:

networks:
  app-network:
    driver: bridge
