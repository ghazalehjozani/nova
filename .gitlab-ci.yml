---
# =============================================================================
# trade-loan (nova) CI/CD
# -----------------------------------------------------------------------------
# Full pipeline (lint -> build -> containerize -> publish -> deploy) lives in
# the shared platform/ci-templates `service.gitlab-ci.yml`.
# Pipeline triggers (from the shared base):
#   - merge request          -> lint + build + containerize-validate (no push)
#   - push to develop         -> build + image publish + snapshot publish + SSH
#                                deploy (dev server always updated; tag = short SHA)
#   - tag v<MAJOR>.<MINOR>.<PATCH> -> build + image publish + deploy
#                                (Maven release publish is disabled below)
#
# Deploy requires these CI/CD variables (set at project/group level, NOT here):
#   PROJECT_NAME / DOCKER_IMAGE_NAME   - ops-deployments key + image short name
#   HEALTH_CHECK_URL                   - post-deploy readiness URL
#   NEXUS_* / DEPLOY_NEXUS_*            - Nexus Maven + Docker creds
#   OPS_DEPLOYMENTS_RO_TOKEN           - read_api on platform/ops-deployments
#   DEPLOY_SSH_* / DEPLOY_PATH         - SSH deploy target on the dev server
#   KEYSTORE_P12_B64                   - `base64 -w0 keystore.p12` (Linux) or `base64 -b 0 keystore.p12` (macOS), masked
# =============================================================================

include:
  - project: 'platform/ci-templates'
    ref: $SHARED_TEMPLATES_VERSION
    file: '/service.gitlab-ci.yml'

default:
  tags:
    - expenditures

variables:
  MVN_BUILD_PROFILES: '!dev,nexus'
  MVN_DEPLOY_SNAPSHOT_PROFILES: '!dev,nexus,release'
  MVN_DEPLOY_RELEASE_PROFILES: '!dev,nexus,release'
  DOCKER_BUILD_CONTEXT: 'container'

build:
  before_script:
    - mkdir -p container/target
    - printf '%s' "$KEYSTORE_P12_B64" | tr -d '[:space:]' | base64 -d > container/target/keystore.p12

lint-yaml:
  extends: .lint-yaml
  variables:
    YAMLLINT_EXTRA_EXCLUDE: './documents/*'

scan-secrets:
  rules:
    - when: never

publish-release:
  rules:
    - when: never

# =============================================================================
# ArchUnit structural gate + Testcontainers integration tests.
# The shared `service.gitlab-ci.yml` builds + unit-tests only; these jobs add
# the hexagonal-architecture enforcement and the DB-backed integration suites.
# Assumptions to confirm against platform/ci-templates: a `test` stage exists,
# the inherited image is JDK 25 + Maven with Nexus settings, and (for the IT
# job) the runner allows Docker-in-Docker.
#
# NOTE: `architecture-test` enforces the trade-loan domain/adapter rules. The
# domain rules currently surface pre-existing violations in core/domain
# (allowlist gaps + entity/factory validation debt) — this job will stay RED
# until those are resolved; that is the gate doing its job, not a misconfig.
# =============================================================================
architecture-test:
  stage: test
  script:
    - mvn -B -P"architecture-test,${MVN_BUILD_PROFILES}" test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

integration-test:
  stage: test
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    # Testcontainers in dind: mapped ports are reachable at the `docker` service
    # host; Ryuk is disabled only here because the dind daemon is ephemeral.
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - mvn -B -P"integration-test,${MVN_BUILD_PROFILES}" verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# =============================================================================
# Publish the C4 architecture viewer (Structurizr Lite) onto the Nova deploy
# host, in the SAME deploy directory as the service, serving the committed
# documents/c4/workspace.json. Reuses the shared deploy SSH vars
# (DEPLOY_SSH_HOST/USER/KEY, DEPLOY_PATH). Manual + allow_failure so it never
# blocks the build/deploy pipeline.
#
# Conflict-safety with Nova's own .env + docker-compose.yml in $DEPLOY_PATH:
#   - the C4 content is isolated in the `c4/` SUBDIR of the deploy path, so
#     rsync --delete only ever touches that subdir, never Nova's root files;
#   - it runs as a SEPARATE compose project (`nova-c4`) with its own
#     container_name + port (8090), so it cannot collide with Nova's compose
#     project, container, or .env;
#   - a guard refuses to run if the dest ever resolves to the deploy root.
# Optional vars: C4_DEPLOY_PATH (default $DEPLOY_PATH/c4), C4_VIEWER_PORT (8090).
# The C4 model is generated/committed via `make c4`, NOT in CI.
# =============================================================================
deploy-c4-viewer:
  stage: deploy
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true
  before_script:
    - command -v rsync >/dev/null || (apt-get update && apt-get install -y --no-install-recommends openssh-client rsync)
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - DEST="${C4_DEPLOY_PATH:-${DEPLOY_PATH%/}/c4}"
    # Never write/delete at the Nova deploy root — the viewer must stay in its own subdir.
    - test "${DEST%/}" != "${DEPLOY_PATH%/}" || { echo "refusing: C4 dest must be a SUBDIR of DEPLOY_PATH, not the Nova root"; exit 1; }
    - SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new"
    - $SSH "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" "mkdir -p '${DEST}'"
    # --delete is safe: it only affects the dedicated c4 subdir, not Nova's .env / docker-compose.yml.
    - rsync -az --delete -e "$SSH" documents/c4/ "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}:${DEST}/"
    # Distinct compose project (`nova-c4`) so it never touches Nova's compose stack in $DEPLOY_PATH.
    - >-
      $SSH "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
      "cd '${DEST}' && chmod -R a+rwX . && STRUCTURIZR_PORT='${C4_VIEWER_PORT:-8090}' docker compose -p nova-c4 up -d"
