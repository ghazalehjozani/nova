# =============================================================================
# Nova DevContainer — Docker Compose
# =============================================================================
# Image:   nexus3.dotin.ir:7111/expenditures/devcontainer-java:2026.2.12-jdk25
# Usage:   devcontainer CLI / JetBrains Gateway / VS Code (IDE-managed)
#
# Infrastructure (PostgreSQL :5433, Kafka :9092, Redis :6379) runs on host —
# accessed via host.docker.internal.
# =============================================================================

services:
  nova-devcontainer:
    image: nexus3.dotin.ir:7111/expenditures/devcontainer-java:2026.2.18-jdk25
    container_name: nova-devcontainer
    hostname: nova-dev
    init: true
    entrypoint: ["/usr/local/share/docker-init.sh"]
    command: sleep infinity

    # -------------------------------------------------------------------------
    # Volumes
    # -------------------------------------------------------------------------
    volumes:
      # Project source
      - ..:/workspace:cached

      # Docker-outside-of-Docker: host socket → container source socket
      - /var/run/docker.sock:/var/run/docker-host.sock

      # Host home (read-only) — post-create.sh selectively copies SSH, GPG,
      # Maven, Docker config. The full home is NOT exposed at runtime.
      - ${HOME}:/host-home:ro

      # Persistent caches
      - maven-cache:/home/developer/.m2
      - gradle-cache:/home/developer/.gradle
      - npm-cache:/home/developer/.npm

      # ZSH history persistence
      - zsh-history:/home/developer/.zsh_history_vol

    # -------------------------------------------------------------------------
    # Environment
    # -------------------------------------------------------------------------
    environment:
      # Docker-outside-of-Docker
      SOURCE_SOCKET: /var/run/docker-host.sock
      TARGET_SOCKET: /var/run/docker.sock
      ENABLE_NONROOT_DOCKER: "true"
      NONROOT_USER: developer
      HOST_HOME: /host-home

      # Shell
      SHELL: /bin/zsh
      TERM: xterm-256color

      # ZSH history — persistent volume
      HISTFILE: /home/developer/.zsh_history_vol/.zsh_history

      # Spring Boot application
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5433/trade_loan
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-trade_loan}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-trade_loan}
      KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: "6379"

    # -------------------------------------------------------------------------
    # Networking
    # -------------------------------------------------------------------------
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # -------------------------------------------------------------------------
    # Security & Capabilities
    # -------------------------------------------------------------------------
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined

    # -------------------------------------------------------------------------
    # Resource Limits
    # -------------------------------------------------------------------------
    mem_limit: 4g
    cpus: 4.0

volumes:
  maven-cache:
  gradle-cache:
  npm-cache:
  zsh-history: