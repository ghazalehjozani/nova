      description: |
        ### شرح عملیات
        فرمول موجود را بروزرسانی می‌کند.

        ### کنترل همزمانی
        از Optimistic Locking استفاده می‌شود:
        - اگر `version` ارسال شود و با نسخه فعلی مطابقت نداشته باشد، خطای 409 برگردانده می‌شود
        - این کار از بازنویسی تغییرات همزمان جلوگیری می‌کند

        ### نکته
        شناسه فرمول قابل تغییر نیست. برای تغییر شناسه، فرمول را حذف و دوباره ایجاد کنید.
        **Request Headers:**
        - `traceparent`
        - `tracestate`
        - `X-Correlation-ID`: Correlation id (required for commands)
        - `Idempotency-Key`: UUID used for idempotent execution
        - `X-Request-DateTime`: Client request timestamp (UTC, ISO 8601)
        - `Accept-Language`: Preferred language (fa | en | ar | ru; default: fa)

        **Response Headers:**
        - `X-Correlation-ID`: Correlation id (required for commands)
        - `X-Idempotency-Replayed`: `true` if response was served from idempotency store
        - `X-Response-DateTime`: Server response timestamp (UTC)
      operationId: update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: traceparent
          in: header
          description: 'W3C trace context: {version}-{traceid}-{parentid}-{traceflags}'
          required: false
          schema:
            type: string
            format: traceparent
          example: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        - name: tracestate
          in: header
