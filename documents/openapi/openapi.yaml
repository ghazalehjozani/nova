        - name: Idempotency-Key
          in: header
          description: Unique identifier for idempotent command execution (UUID)
          required: true
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-42d3-a456-556642440000
        - name: X-Request-DateTime
          in: header
          description: Client request timestamp in UTC ISO 8601 format
          required: true
          schema:
            type: string
            format: date-time
          example: '2025-08-22T14:30:00.123Z'
        - name: Accept-Language
          in: header
          description: Language preference for response messages
          required: false
          schema:
            type: string
            default: fa
            enum:
              - fa
              - en
              - ar
              - ru
          example: fa
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: |
                درخواست بروزرسانی فرمول موجود

                ### نکات مهم:
                - شناسه فرمول قابل تغییر نیست
                - برای کنترل همزمانی از فیلد `version` استفاده کنید
                - اگر version ارسال شود و با نسخه فعلی مطابقت نداشته باشد، خطای 409 برگردانده می‌شود

                ### مثال:
                ```json
                {
                  "expression": "principal * (rate + margin) * time / 100",
                  "description": "محاسبه سود با مارجین",
                  "version": 1
                }
                ```
              properties: &ref_56
                expression:
                  type: string
                  description: عبارت ریاضی جدید فرمول
                  example: principal * (rate + margin) * time / 100
                  maxLength: 2000
                  minLength: 0
                description:
                  type:
                    - string
                    - 'null'
                  description: توضیحات جدید فرمول
                  example: محاسبه سود با در نظر گرفتن مارجین بانک
                providerType:
                  type:
                    - string
                    - 'null'
                  description: نوع Provider جدید
                bindings:
                  type: array
                  description: لیست بایندینگ‌های جدید - اگر null باشد، بایندینگ‌های قبلی حفظ می‌شوند
                  items:
                    type: object
                    description: |
                      تعریف نحوه مقداردهی یک متغیر در فرمول

                      ### روش‌های تعریف:

                      | حالت | توضیح | فیلد مورد نیاز |
                      |------|-------|----------------|
                      | **مقدار ثابت** | عدد ثابت | `value` |
                      | **ارجاع به فرمول** | نتیجه فرمول دیگر | `formulaRef` |
                      | **خودکار** | سیستم از Provider پیدا می‌کند | هیچکدام |

                      ### مثال‌ها:

                      ```json
                      // مقدار ثابت
                      {"variable": "tax_rate", "value": "0.09"}

                      // ارجاع به فرمول دیگر
                      {"variable": "base_rate", "formulaRef": "base-interest-rate"}

                      // تشخیص خودکار از Provider
                      {"variable": "principal"}
                      ```
                    properties: *ref_46
                    required: *ref_47
                version:
                  type:
                    - integer
                    - 'null'
                  format: int64
                  description: |
                    نسخه فعلی فرمول برای کنترل همزمانی (Optimistic Locking)

                    - اگر ارسال شود، با نسخه ذخیره شده مقایسه می‌شود
                    - در صورت عدم تطابق، خطای 409 Conflict برگردانده می‌شود
                    - اگر ارسال نشود، کنترل نسخه انجام نمی‌شود
                  example: 1
