    description: Write operations (commands) for loan types.
  - name: Loan Types · Queries
    description: Read operations (queries) for loan types.
  - name: Loan Arrangements · Commands
    description: Write operations (commands) for loan arrangements.
  - name: Loan Arrangements · Queries
    description: Read operations (queries) for loan arrangements.
  - name: Loan Facilities · Commands
    description: Write operations (commands) for loan facilities.
  - name: Loan Facilities · Queries
    description: Read operations (queries) for loan facilities.
  - name: Installment Schedules · Queries
    description: Read operations (queries) for installment schedules.
