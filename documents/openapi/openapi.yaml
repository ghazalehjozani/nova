    post:
      tags:
        - Formula Commands
      summary: Create formula
      description: |
        ### شرح عملیات
        یک فرمول جدید با شناسه یکتا ایجاد می‌کند.

        ### پیش‌نیازها
        - شناسه فرمول باید یکتا باشد
        - عبارت ریاضی باید معتبر باشد
        - فرمول‌های مرجع (برای REFERENCE) باید از قبل وجود داشته باشند

        ### مثال استفاده
        ```bash
        curl -X POST /v1/formulas \
          -H "Content-Type: application/json" \
          -d '{"id": "simple-interest", "expression": "p * r * t / 100", "bindings": []}'
        ```
        **Request Headers:**
        - `traceparent`
        - `tracestate`
        - `X-Correlation-ID`: Correlation id (required for commands)
        - `Idempotency-Key`: UUID used for idempotent execution
        - `X-Request-DateTime`: Client request timestamp (UTC, ISO 8601)
        - `Accept-Language`: Preferred language (fa | en | ar | ru; default: fa)

        **Response Headers:**
        - `X-Correlation-ID`: Correlation id (required for commands)
        - `X-Idempotency-Replayed`: `true` if response was served from idempotency store
        - `X-Response-DateTime`: Server response timestamp (UTC)
      operationId: create
      parameters:
        - name: traceparent
          in: header
          description: 'W3C trace context: {version}-{traceid}-{parentid}-{traceflags}'
          required: false
          schema:
            type: string
            format: traceparent
          example: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        - name: tracestate
          in: header
          description: W3C trace state (optional vendor-specific trace data)
          required: false
          schema:
            type: string
          example: vendor=opaque
        - name: X-Correlation-ID
          in: header
          description: Client-supplied correlation id tying related requests together
          required: true
          schema:
            type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        - name: Idempotency-Key
          in: header
          description: Unique identifier for idempotent command execution (UUID)
          required: true
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-42d3-a456-556642440000
        - name: X-Request-DateTime
          in: header
          description: Client request timestamp in UTC ISO 8601 format
          required: true
          schema:
            type: string
            format: date-time
          example: '2025-08-22T14:30:00.123Z'
