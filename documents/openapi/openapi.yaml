openapi: 3.1.0
info:
  title: nova-service
  description: |-
    **Expenditures Gateway — public API**

    - Calls run through the gateway; base path `/nova-service/v1`
    - Upstream service `nova-service`, resolved via Consul to `10.20.151.144:8085` (1 instance up)
    - Original spec: [http://10.20.151.144:8085/v3/api-docs/v1](http://10.20.151.144:8085/v3/api-docs/v1)

    ---

    Trade loan microservice REST API. Every endpoint is exposed publicly through the API gateway under `/nova-service`. Request/response transport headers and the standard error envelope are documented per operation.
  contact:
    name: Loan Customer base Team
  license:
    name: Proprietary
  version: 2026.6.1-SNAPSHOT
servers:
  - url: /
security:
  - bearer-jwt: []
    oauth2: []
tags:
