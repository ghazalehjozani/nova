  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Unique identifier for idempotent command execution (UUID)
      required: true
      schema:
        type: string
        format: uuid
      example: 123e4567-e89b-42d3-a456-556642440000
    XRequestDateTime:
      name: X-Request-DateTime
      in: header
      description: Request timestamp in UTC ISO 8601 format
      required: true
      schema:
        type: string
        format: date-time
      example: '2025-08-22T14:30:00.123Z'
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: Language preference for response messages
      required: false
      schema:
        type: string
        default: fa
        enum:
          - fa
          - en
          - ar
          - ru
      example: fa
    XRequestId:
      name: X-Request-ID
      in: header
      description: Unique request identifier (UUID)
      required: true
      schema:
        type: string
        format: uuid
      example: 123e4567-e89b-42d3-a456-556642440000
