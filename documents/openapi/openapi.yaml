                  minLength: 1
                variables:
                  type: object
                  additionalProperties:
                    type: number
                  description: |
                    مقادیر متغیرها برای محاسبه

                    - کلید: نام متغیر (باید با نام در فرمول مطابقت داشته باشد)
                    - مقدار: عدد (BigDecimal)

                    ### نکته:
                    از اعداد رشته‌ای برای دقت بالا استفاده کنید:
                    ```json
                    {"amount": "1234567890.123456"}
                    ```
                  example:
                    principal: 50000000
                    rate: 18.5
                    time: 12
              required: &ref_116
                - formulaId
                - variables
