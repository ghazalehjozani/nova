      required: false
      schema:
        type: string
        format: date-time
      example: '2025-08-22T14:30:00.123Z'
    ACCEPT_LANGUAGE:
      name: Accept-Language
      in: header
      description: Language preference for response messages
      required: false
      schema:
        type: string
        default: fa
        enum:
          - fa
          - en
      example: fa
    IDEMPOTENCY_REPLAYED:
