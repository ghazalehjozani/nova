          in: header
          description: Language preference for response messages
          required: false
          schema:
            type: string
            default: fa
            enum:
              - fa
              - en
              - ar
              - ru
          example: fa
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: |
                درخواست ایجاد فرمول جدید

                ### ویژگی‌های خودکار:
                - **تشخیص خودکار Provider**: نیازی به تعیین providerType نیست
                - **بایندینگ خودکار**: متغیرهای شناخته‌شده خودکار متصل می‌شوند
                - **نوع بایندینگ**: از روی فیلدهای پر شده تشخیص داده می‌شود

                ### مثال ساده:
                ```json
                {
                  "id": "simple-interest",
                  "expression": "principal * rate * time / 100"
                }
                ```

                ### مثال با بایندینگ ثابت:
                ```json
                {
                  "id": "loan-penalty",
                  "expression": "principal * penalty_rate",
                  "bindings": [
                    {"variable": "penalty_rate", "value": "0.12"}
                  ]
                }
                ```
              example: &ref_108
                id: compound-interest
                expression: principal * (1 + rate/100) ^ time
                description: محاسبه سود مرکب
              properties: &ref_109
                id:
                  type: string
                  description: شناسه یکتای فرمول
                  example: loan-interest-calc
                  maxLength: 100
                  minLength: 1
                  pattern: ^[a-zA-Z][a-zA-Z0-9-]*$
                expression:
                  type: string
                  description: |
                    عبارت ریاضی فرمول
                  example: principal * rate * time / 100
                  maxLength: 2000
                  minLength: 0
                description:
                  type:
                    - string
                    - 'null'
                  description: توضیحات فرمول
                  example: محاسبه سود ساده وام
                  maxLength: 500
                  minLength: 0
                bindings:
                  type: array
                  description: |
                    تعریف مقادیر متغیرها (اختیاری)

                    - متغیرهای شناخته‌شده خودکار از Provider گرفته می‌شوند
                    - فقط برای مقادیر ثابت یا ارجاع به فرمول دیگر نیاز به تعریف است
                  items:
                    type: object
                    description: |
                      تعریف نحوه مقداردهی یک متغیر در فرمول

                      ### روش‌های تعریف:

                      | حالت | توضیح | فیلد مورد نیاز |
                      |------|-------|----------------|
                      | **مقدار ثابت** | عدد ثابت | `value` |
                      | **ارجاع به فرمول** | نتیجه فرمول دیگر | `formulaRef` |
                      | **خودکار** | سیستم از Provider پیدا می‌کند | هیچکدام |

                      ### مثال‌ها:

                      ```json
                      // مقدار ثابت
                      {"variable": "tax_rate", "value": "0.09"}

                      // ارجاع به فرمول دیگر
                      {"variable": "base_rate", "formulaRef": "base-interest-rate"}

                      // تشخیص خودکار از Provider
                      {"variable": "principal"}
                      ```
                    properties: &ref_46
                      variable:
                        type: string
                        description: نام متغیر در عبارت فرمول
                        example: principal
                        minLength: 1
                      value:
                        type:
                          - string
                          - 'null'
                        description: |
                          مقدار ثابت عددی

                          - اگر مقدار ثابت می‌خواهید، این فیلد را پر کنید
                          - باید عدد معتبر باشد (می‌تواند اعشاری باشد)
                        example: '1000000.50'
                      formulaRef:
                        type:
                          - string
                          - 'null'
                        description: |
                          شناسه فرمول مرجع

                          - اگر می‌خواهید نتیجه یک فرمول دیگر استفاده شود، این فیلد را پر کنید
                          - فرمول مرجع باید از قبل وجود داشته باشد
                        example: base-interest-rate
                      reference:
                        type: boolean
                      literal:
                        type: boolean
                      autoResolve:
                        type: boolean
                    required: &ref_47
                      - variable
