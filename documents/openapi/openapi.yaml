    TRACEPARENT:
      name: traceparent
      in: header
      description: 'W3C trace context: {version}-{traceid}-{parentid}-{traceflags}'
      required: false
      schema:
        type: string
        format: traceparent
      example: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
    TRACESTATE:
      name: tracestate
      in: header
      description: W3C trace state (optional vendor-specific trace data)
