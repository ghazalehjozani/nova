asyncapi: 3.0.0

info:
  title: Nova Trade Loan — Asynchronous API
  version: 1.0.0
  description: >-
    Event- and command-channel contract for the Nova trade-loan microservice.


    This document complements the synchronous REST OpenAPI (Swagger UI). It covers two directions:

    * **Inbound** — request/reply command queues consumed by Nova (FCB operation events, and the
      full-lifecycle saga command over Kafka or ActiveMQ).

    * **Outbound** — domain events Nova publishes through the transactional outbox, one Kafka topic per
      aggregate.


    Every message carries the platform transport headers (correlation, idempotency, W3C trace context,
    request timestamp, locale). Command channels additionally require an `Authorization` bearer token; the
    full-lifecycle saga command adds the flow-routing headers.
  contact:
    name: Loan Customer base Team
  license:
    name: Proprietary
  tags:
    - name: inbound
      description: Channels Nova consumes (request/reply commands).
    - name: outbound
      description: Domain-event topics Nova publishes via the transactional outbox.
    - name: full-lifecycle
      description: Saga-driven full loan-lifecycle command (request/reply).
    - name: fcb
      description: FCB (legacy core) operation events.

servers:
  kafka:
    host: kafka.nova.internal:9094
    protocol: kafka
    protocolVersion: "3.7"
    description: Primary Kafka cluster (SASL_PLAINTEXT / OAUTHBEARER). Host is environment-specific.
  activemq:
    host: activemq.nova.internal:61616
    protocol: jms
    description: ActiveMQ broker for the legacy JMS request/reply path. Host is environment-specific.

channels:
  fcbOperationEvents:
    address: corridor.core.loan.nova.installment-operation.request.queue.v1
    title: FCB operation events
    description: >-
      Envelope topic carrying many FCB `operationType`s (installment collection, paid-off closure,
      cancellation, collateral update, restructuring, …). Ingested idempotently via the platform inbox.
    servers:
      - $ref: '#/servers/kafka'
    messages:
      FcbOperationEvent:
        $ref: '#/components/messages/FcbOperationEvent'

  fullLifecycleCommand:
    address: corridor.core.loan.nova.full-lifecycle.request.queue.v1
    title: Full loan-lifecycle command (request/reply)
    description: >-
      Saga-driven command that drives a loan facility through its whole lifecycle. Available over both Kafka
      and ActiveMQ; the reply is published to the caller-supplied reply destination.
    servers:
      - $ref: '#/servers/kafka'
      - $ref: '#/servers/activemq'
    messages:
      FullLoanFacilityLifecycleCommand:
        $ref: '#/components/messages/FullLoanFacilityLifecycleCommand'

  tradeLoanFacilityEvents:
    address: corridor.core.loan.nova.trade-loan-facility.event.topic.v1
    title: Trade loan facility events
    description: Domain events for the TradeLoanFacility aggregate (lifecycle + compensation/revert events).
    servers:
      - $ref: '#/servers/kafka'
    messages:
      Created: { $ref: '#/components/messages/TradeLoanFacilityCreated' }
      Approved: { $ref: '#/components/messages/TradeLoanFacilityApproved' }
      FullyDisbursed: { $ref: '#/components/messages/TradeLoanFacilityFullyDisbursed' }
      LumpSumDisbursed: { $ref: '#/components/messages/TradeLoanFacilityLumpSumDisbursed' }
      IrregularTrancheDisbursed: { $ref: '#/components/messages/TradeLoanFacilityIrregularTrancheDisbursed' }
      PaidOffClosed: { $ref: '#/components/messages/TradeLoanFacilityPaidOffClosed' }
      ClosedDefaulted: { $ref: '#/components/messages/TradeLoanFacilityClosedDefaulted' }
      OriginationReverted: { $ref: '#/components/messages/TradeLoanFacilityOriginationReverted' }
      ApprovalReverted: { $ref: '#/components/messages/TradeLoanFacilityApprovalReverted' }
      ContractIssuanceReverted: { $ref: '#/components/messages/TradeLoanFacilityContractIssuanceReverted' }
      DisbursementReverted: { $ref: '#/components/messages/TradeLoanFacilityDisbursementReverted' }

  tradeLoanArrangementEvents:
    address: corridor.core.loan.nova.trade-loan-arrangement.event.topic.v1
    title: Trade loan arrangement events
    description: Domain events for the TradeLoanArrangement aggregate.
    servers:
      - $ref: '#/servers/kafka'
    messages:
      Created: { $ref: '#/components/messages/TradeLoanArrangementCreated' }

  tradeLoanTypeEvents:
    address: corridor.core.loan.nova.trade-loan-type.event.topic.v1
    title: Trade loan type events
    description: Domain events for the TradeLoanType aggregate.
    servers:
      - $ref: '#/servers/kafka'
    messages:
      Created: { $ref: '#/components/messages/TradeLoanTypeCreated' }

  installmentScheduleEvents:
    address: corridor.core.loan.nova.trade-loan-installment-schedule.event.topic.v1
    title: Installment schedule events
    description: Domain events for the InstallmentSchedule aggregate.
    servers:
      - $ref: '#/servers/kafka'
    messages:
      Generated: { $ref: '#/components/messages/InstallmentScheduleGenerated' }

operations:
  consumeFcbOperationEvents:
    action: receive
    title: Consume FCB operation events
    channel:
      $ref: '#/channels/fcbOperationEvents'
    messages:
      - $ref: '#/channels/fcbOperationEvents/messages/FcbOperationEvent'

  consumeFullLifecycleCommand:
    action: receive
    title: Process full loan-lifecycle command
    channel:
      $ref: '#/channels/fullLifecycleCommand'
    messages:
      - $ref: '#/channels/fullLifecycleCommand/messages/FullLoanFacilityLifecycleCommand'

  publishTradeLoanFacilityEvents:
    action: send
    title: Publish trade loan facility events
    channel:
      $ref: '#/channels/tradeLoanFacilityEvents'

  publishTradeLoanArrangementEvents:
    action: send
    title: Publish trade loan arrangement events
    channel:
      $ref: '#/channels/tradeLoanArrangementEvents'

  publishTradeLoanTypeEvents:
    action: send
    title: Publish trade loan type events
    channel:
      $ref: '#/channels/tradeLoanTypeEvents'

  publishInstallmentScheduleEvents:
    action: send
    title: Publish installment schedule events
    channel:
      $ref: '#/channels/installmentScheduleEvents'

components:
  messages:
    FcbOperationEvent:
      name: FcbOperationEvent
      title: FCB operation event
      summary: An FCB core-banking operation event (operationType discriminates the concrete payload).
      contentType: application/json
      headers:
        $ref: '#/components/schemas/EventHandlerHeaders'
      payload:
        $ref: '#/components/schemas/FcbOperationEnvelope'

    FullLoanFacilityLifecycleCommand:
      name: FullLoanFacilityLifecycleCommand
      title: Full loan-lifecycle command
      summary: Drives a loan facility through its full lifecycle as a saga (request/reply).
      contentType: application/json
      headers:
        $ref: '#/components/schemas/CommandHeaders'
      payload:
        $ref: '#/components/schemas/FullLoanFacilityLifecycleMessage'

    TradeLoanFacilityCreated:
      $ref: '#/components/messages/_DomainEvent'
    TradeLoanFacilityApproved:
      $ref: '#/components/messages/_DomainEvent'
    TradeLoanFacilityFullyDisbursed:
      $ref: '#/components/messages/_DomainEvent'
    TradeLoanFacilityLumpSumDisbursed:
      $ref: '#/components/messages/_DomainEvent'
    TradeLoanFacilityIrregularTrancheDisbursed:
      $ref: '#/components/messages/_DomainEvent'
    TradeLoanFacilityPaidOffClosed:
      $ref: '#/components/messages/_DomainEvent'
    TradeLoanFacilityClosedDefaulted:
      $ref: '#/components/messages/_DomainEvent'
    TradeLoanFacilityOriginationReverted:
      $ref: '#/components/messages/_DomainEvent'
    TradeLoanFacilityApprovalReverted:
      $ref: '#/components/messages/_DomainEvent'
    TradeLoanFacilityContractIssuanceReverted:
      $ref: '#/components/messages/_DomainEvent'
    TradeLoanFacilityDisbursementReverted:
      $ref: '#/components/messages/_DomainEvent'
    TradeLoanArrangementCreated:
      $ref: '#/components/messages/_DomainEvent'
    TradeLoanTypeCreated:
      $ref: '#/components/messages/_DomainEvent'
    InstallmentScheduleGenerated:
      $ref: '#/components/messages/_DomainEvent'

    _DomainEvent:
      name: DomainEvent
      title: Domain event
      summary: A domain event published via the transactional outbox.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/DomainEventHeaders'
      payload:
        $ref: '#/components/schemas/DomainEventEnvelope'

  schemas:
    CommandHeaders:
      type: object
      title: CommandHeaders
      description: Standard transport headers required on every platform command message.
      required: [Idempotency-Key, X-Request-DateTime, Authorization, traceparent]
      properties:
        Idempotency-Key: { type: string, format: uuid, description: Unique idempotency key. }
        X-Request-DateTime: { type: string, format: date-time, description: Client request timestamp (UTC, ISO-8601). }
        Accept-Language: { type: string, enum: [fa, en, ar, ru], default: fa }
        Authorization: { type: string, description: "Bearer access token." }
        traceparent: { type: string, description: W3C trace context parent id. }
        tracestate: { type: string, description: W3C trace context state (optional). }
        reply-to: { type: string, description: Reply destination for request/reply. }
        kafka_correlationId: { type: string, description: Kafka request/reply correlation id (Kafka transport only). }
        jms_correlationId: { type: string, description: JMS request/reply correlation id (ActiveMQ transport only). }

    EventHandlerHeaders:
      type: object
      title: EventHandlerHeaders
      description: Headers for inbound FCB operation events.
      required: [eventUid, operationType, Idempotency-Key]
      properties:
        eventUid: { type: string, format: uuid, description: Unique event identifier. }
        operationType: { type: string, description: FCB operation discriminator. }
        Idempotency-Key: { type: string, format: uuid, description: Idempotency key. }

    DomainEventHeaders:
      type: object
      title: DomainEventHeaders
      description: Headers carried on outbound domain events.
      required: [X-Correlation-ID, X-Request-DateTime, traceparent]
      properties:
        X-Correlation-ID: { type: string, description: Correlation id tying related messages together. }
        X-Causation-ID: { type: string, description: Id of the message that caused this event. }
        X-Request-DateTime: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }

    DomainEventEnvelope:
      type: object
      title: DomainEventEnvelope
      description: Common envelope for every outbound domain event.
      required: [eventId, eventType, aggregateId, aggregateType, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string, description: "Concrete event type, e.g. TradeLoanFacilityApproved." }
        aggregateId: { type: string, format: uuid }
        aggregateType: { type: string, description: "e.g. TradeLoanFacility, TradeLoanArrangement, TradeLoanType, InstallmentSchedule." }
        occurredAt: { type: string, format: date-time }
        payload:
          type: object
          description: Event-specific body (shape varies per eventType).
          additionalProperties: true

    FcbOperationEnvelope:
      type: object
      title: FcbOperationEnvelope
      description: FCB operation event body (legacy core terms; translated at the adapter boundary).
      required: [operationType, eventUid]
      properties:
        operationType: { type: string }
        eventUid: { type: string, format: uuid }
        payload:
          type: object
          additionalProperties: true

    FullLoanFacilityLifecycleMessage:
      type: object
      title: FullLoanFacilityLifecycleMessage
      description: Request payload of the full loan-lifecycle saga command (summary view).
      properties:
        loanTypeCode: { type: string }
        loanArrangementCode: { type: string }
        loanApplication:
          type: object
          description: Applicant(s), requested amount, tenor, collaterals.
          additionalProperties: true
        disbursement:
          type: object
          description: Disbursement plan (tranches / destinations).
          additionalProperties: true
